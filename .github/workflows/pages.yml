name: Publicar EBD no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar calendário e arquivos
        run: node tools/validar.cjs
      - name: Validar permissões da área restrita
        run: node --test backend/worker.test.mjs
      - name: Preparar apenas os arquivos públicos
        run: |
          mkdir _site
          cp index.html style.css app.js access.js icone.svg _site/
          cp -r dados _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
